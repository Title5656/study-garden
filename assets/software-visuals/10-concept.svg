<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" role="img"><title>Where does a Git change live?</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#5864ad"/></marker></defs><rect width="640" height="550" rx="22" fill="#f1f2fb"/><text x="30" y="44" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#202647">Where does a Git change live?</text><rect x="30" y="73" width="580" height="88" rx="14" fill="white" stroke="#cbd0e9"/><circle cx="62" cy="117" r="18" fill="#dde2ff"/><text x="62" y="124" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" fill="#27335f">1</text><text x="100" y="108" font-family="Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#202647">Working tree</text><text x="100" y="138" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5573">Edit the actual project files</text><path d="M320 163V184" stroke="#5864ad" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="188" width="580" height="88" rx="14" fill="white" stroke="#cbd0e9"/><circle cx="62" cy="232" r="18" fill="#dde2ff"/><text x="62" y="239" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" fill="#27335f">2</text><text x="100" y="223" font-family="Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#202647">Staging area</text><text x="100" y="253" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5573">git add selects the snapshot</text><path d="M320 278V299" stroke="#5864ad" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="303" width="580" height="88" rx="14" fill="white" stroke="#cbd0e9"/><circle cx="62" cy="347" r="18" fill="#dde2ff"/><text x="62" y="354" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" fill="#27335f">3</text><text x="100" y="338" font-family="Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#202647">Local repository</text><text x="100" y="368" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5573">git commit records a version</text><path d="M320 393V414" stroke="#5864ad" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="418" width="580" height="88" rx="14" fill="white" stroke="#cbd0e9"/><circle cx="62" cy="462" r="18" fill="#dde2ff"/><text x="62" y="469" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" fill="#27335f">4</text><text x="100" y="453" font-family="Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#202647">Remote repository</text><text x="100" y="483" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5573">git push shares local commits</text></svg>