<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 970" role="img" aria-labelledby="title desc"><title id="title">ระบบนัดหมายคลินิก · มุมมองตามบทบาท</title><desc id="desc">แต่ละช่องเป็นมุมมองย่อยของระบบเดียวกัน Actor อยู่ภายนอกกรอบ เส้นเชื่อมแสดงการมีส่วนร่วมกับ use case ไม่ใช่ลำดับเวลา</desc><rect width="100%" height="100%" fill="#faf9f5"/><style>text{font-family:Tahoma,sans-serif;fill:#24263b}.boundary{fill:#f0eff8;stroke:#696089;stroke-width:1.5}.uc{fill:white;stroke:#696089;stroke-width:1.5}.line{fill:none;stroke:#44465c;stroke-width:1.5}</style><text x="500" y="35" text-anchor="middle" font-size="24">ระบบนัดหมายคลินิก · มุมมองตามบทบาท</text><g transform="translate(0,60)"><rect class="boundary" x="140" y="10" width="345" height="425" rx="8"/><text x="312" y="35" text-anchor="middle" font-size="16">ขอบเขตระบบ · มุมมอง 1</text><circle class="line" cx="65" cy="160" r="15"/><path class="line" d="M65 175V235 M35 195H95 M65 235L35 280 M65 235L95 280"/><text x="65" y="310" text-anchor="middle" font-size="18">ผู้ป่วย</text><path class="line" d="M95 195L158 75"/><ellipse class="uc" cx="312" cy="75" rx="154" ry="25"/><text x="312" y="81" text-anchor="middle" font-size="17">สร้างบัญชี / เข้าสู่ระบบ</text><path class="line" d="M95 195L158 139"/><ellipse class="uc" cx="312" cy="139" rx="154" ry="25"/><text x="312" y="145" text-anchor="middle" font-size="17">จองนัดกับทันตแพทย์</text><path class="line" d="M95 195L158 203"/><ellipse class="uc" cx="312" cy="203" rx="154" ry="25"/><text x="312" y="209" text-anchor="middle" font-size="17">ดูนัดที่จะมาถึง / ประวัติ</text><path class="line" d="M95 195L158 267"/><ellipse class="uc" cx="312" cy="267" rx="154" ry="25"/><text x="312" y="273" text-anchor="middle" font-size="17">เปลี่ยนแปลงนัด</text><path class="line" d="M95 195L158 331"/><ellipse class="uc" cx="312" cy="331" rx="154" ry="25"/><text x="312" y="337" text-anchor="middle" font-size="17">ยกเลิกนัด</text></g><g transform="translate(500,60)"><rect class="boundary" x="140" y="10" width="345" height="425" rx="8"/><text x="312" y="35" text-anchor="middle" font-size="16">ขอบเขตระบบ · มุมมอง 2</text><circle class="line" cx="65" cy="160" r="15"/><path class="line" d="M65 175V235 M35 195H95 M65 235L35 280 M65 235L95 280"/><text x="65" y="310" text-anchor="middle" font-size="18">ทันตแพทย์</text><path class="line" d="M95 195L158 75"/><ellipse class="uc" cx="312" cy="75" rx="154" ry="25"/><text x="312" y="81" text-anchor="middle" font-size="17">เข้าสู่ระบบ</text><path class="line" d="M95 195L158 139"/><ellipse class="uc" cx="312" cy="139" rx="154" ry="25"/><text x="312" y="145" text-anchor="middle" font-size="17">ดูตารางและรายละเอียดนัด</text><path class="line" d="M95 195L158 203"/><ellipse class="uc" cx="312" cy="203" rx="154" ry="25"/><text x="312" y="209" text-anchor="middle" font-size="17">เปลี่ยนแปลงนัด</text><path class="line" d="M95 195L158 267"/><ellipse class="uc" cx="312" cy="267" rx="154" ry="25"/><text x="312" y="273" text-anchor="middle" font-size="17">อัปเดตสถานะนัด</text><path class="line" d="M95 195L158 331"/><ellipse class="uc" cx="312" cy="331" rx="154" ry="25"/><text x="312" y="337" text-anchor="middle" font-size="17">เพิ่มบันทึกการมาพบ</text></g><g transform="translate(0,510)"><rect class="boundary" x="140" y="10" width="345" height="425" rx="8"/><text x="312" y="35" text-anchor="middle" font-size="16">ขอบเขตระบบ · มุมมอง 3</text><circle class="line" cx="65" cy="160" r="15"/><path class="line" d="M65 175V235 M35 195H95 M65 235L35 280 M65 235L95 280"/><text x="65" y="310" text-anchor="middle" font-size="18">เจ้าหน้าที่</text><path class="line" d="M95 195L158 75"/><ellipse class="uc" cx="312" cy="75" rx="154" ry="25"/><text x="312" y="81" text-anchor="middle" font-size="17">จัดการข้อมูลผู้ป่วย</text><path class="line" d="M95 195L158 139"/><ellipse class="uc" cx="312" cy="139" rx="154" ry="25"/><text x="312" y="145" text-anchor="middle" font-size="17">อัปเดตเวลาที่พร้อมนัด</text><path class="line" d="M95 195L158 203"/><ellipse class="uc" cx="312" cy="203" rx="154" ry="25"/><text x="312" y="209" text-anchor="middle" font-size="17">เปลี่ยนนัดแทนผู้ป่วย</text><path class="line" d="M95 195L158 267"/><ellipse class="uc" cx="312" cy="267" rx="154" ry="25"/><text x="312" y="273" text-anchor="middle" font-size="17">ยกเลิกนัดแทนผู้ป่วย</text><path class="line" d="M95 195L158 331"/><ellipse class="uc" cx="312" cy="331" rx="154" ry="25"/><text x="312" y="337" text-anchor="middle" font-size="17">สร้างรายงานสถิตินัด</text></g><g transform="translate(500,510)"><rect class="boundary" x="140" y="10" width="345" height="425" rx="8"/><text x="312" y="35" text-anchor="middle" font-size="16">ขอบเขตระบบ · มุมมอง 4</text><circle class="line" cx="65" cy="160" r="15"/><path class="line" d="M65 175V235 M35 195H95 M65 235L35 280 M65 235L95 280"/><text x="65" y="310" text-anchor="middle" font-size="18">ผู้ดูแลระบบ</text><path class="line" d="M95 195L158 75"/><ellipse class="uc" cx="312" cy="75" rx="154" ry="25"/><text x="312" y="81" text-anchor="middle" font-size="17">จัดการบัญชีผู้ใช้</text><path class="line" d="M95 195L158 139"/><ellipse class="uc" cx="312" cy="139" rx="154" ry="25"/><text x="312" y="145" text-anchor="middle" font-size="17">อัปเดตตารางคลินิก</text><path class="line" d="M95 195L158 203"/><ellipse class="uc" cx="312" cy="203" rx="154" ry="25"/><text x="312" y="209" text-anchor="middle" font-size="17">กำหนดเพดานนัดต่อแพทย์</text><path class="line" d="M95 195L158 267"/><ellipse class="uc" cx="312" cy="267" rx="154" ry="25"/><text x="312" y="273" text-anchor="middle" font-size="17">กำหนดวันหยุดคลินิก</text></g></svg>