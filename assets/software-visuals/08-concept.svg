<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" role="img"><title>Good modules focus and cooperate</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#5864ad"/></marker></defs><rect width="640" height="550" rx="22" fill="#f1f2fb"/><text x="30" y="44" font-family="Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#202647">Good modules focus and cooperate</text><rect x="30" y="73" width="580" height="88" rx="14" fill="white" stroke="#cbd0e9"/><circle cx="62" cy="117" r="18" fill="#dde2ff"/><text x="62" y="124" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" fill="#27335f">1</text><text x="100" y="108" font-family="Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#202647">Inside a module</text><text x="100" y="138" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5573">High cohesion: one clear purpose</text><rect x="30" y="188" width="580" height="88" rx="14" fill="white" stroke="#cbd0e9"/><circle cx="62" cy="232" r="18" fill="#dde2ff"/><text x="62" y="239" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" fill="#27335f">2</text><text x="100" y="223" font-family="Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#202647">Between modules</text><text x="100" y="253" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5573">Low coupling: narrow interfaces</text><rect x="30" y="303" width="580" height="88" rx="14" fill="white" stroke="#cbd0e9"/><circle cx="62" cy="347" r="18" fill="#dde2ff"/><text x="62" y="354" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" fill="#27335f">3</text><text x="100" y="338" font-family="Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#202647">Hide implementation</text><text x="100" y="368" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5573">Expose the contract, not internals</text><rect x="30" y="418" width="580" height="88" rx="14" fill="white" stroke="#cbd0e9"/><circle cx="62" cy="462" r="18" fill="#dde2ff"/><text x="62" y="469" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" fill="#27335f">4</text><text x="100" y="453" font-family="Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#202647">Evaluate the trade-off</text><text x="100" y="483" font-family="Segoe UI,sans-serif" font-size="21" fill="#4d5573">Quality depends on the context</text></svg>