<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">ระบบ POS · มุมมองตามบทบาท</title><desc id="desc">แต่ละช่องเป็นมุมมองย่อยของระบบเดียวกัน Actor อยู่ภายนอกกรอบ เส้นเชื่อมแสดงการมีส่วนร่วมกับ use case ไม่ใช่ลำดับเวลา</desc><rect width="100%" height="100%" fill="#faf9f5"/><style>text{font-family:Tahoma,sans-serif;fill:#24263b}.boundary{fill:#f0eff8;stroke:#696089;stroke-width:1.5}.uc{fill:white;stroke:#696089;stroke-width:1.5}.line{fill:none;stroke:#44465c;stroke-width:1.5}</style><text x="500" y="35" text-anchor="middle" font-size="24">ระบบ POS · มุมมองตามบทบาท</text><g transform="translate(0,60)"><rect class="boundary" x="140" y="10" width="345" height="425" rx="8"/><text x="312" y="35" text-anchor="middle" font-size="16">ขอบเขตระบบ · มุมมอง 1</text><circle class="line" cx="65" cy="160" r="15"/><path class="line" d="M65 175V235 M35 195H95 M65 235L35 280 M65 235L95 280"/><text x="65" y="310" text-anchor="middle" font-size="18">พนักงานขาย</text><path class="line" d="M95 195L158 75"/><ellipse class="uc" cx="312" cy="75" rx="154" ry="25"/><text x="312" y="81" text-anchor="middle" font-size="17">ดูสินค้าและจำนวนคงเหลือ</text><path class="line" d="M95 195L158 139"/><ellipse class="uc" cx="312" cy="139" rx="154" ry="25"/><text x="312" y="145" text-anchor="middle" font-size="17">เพิ่ม / ลบสินค้าในรายการขาย</text><path class="line" d="M95 195L158 203"/><ellipse class="uc" cx="312" cy="203" rx="154" ry="25"/><text x="312" y="209" text-anchor="middle" font-size="17">ใช้ส่วนลดที่ร้านกำหนด</text><path class="line" d="M95 195L158 267"/><ellipse class="uc" cx="312" cy="267" rx="154" ry="25"/><text x="312" y="273" text-anchor="middle" font-size="17">รับชำระเงิน</text><path class="line" d="M95 195L158 331"/><ellipse class="uc" cx="312" cy="331" rx="154" ry="25"/><text x="312" y="337" text-anchor="middle" font-size="17">ออกใบเสร็จหลังชำระสำเร็จ</text></g><g transform="translate(500,60)"><rect class="boundary" x="140" y="10" width="345" height="425" rx="8"/><text x="312" y="35" text-anchor="middle" font-size="16">ขอบเขตระบบ · มุมมอง 2</text><circle class="line" cx="65" cy="160" r="15"/><path class="line" d="M65 175V235 M35 195H95 M65 235L35 280 M65 235L95 280"/><text x="65" y="310" text-anchor="middle" font-size="18">ผู้จัดการ</text><path class="line" d="M95 195L158 75"/><ellipse class="uc" cx="312" cy="75" rx="154" ry="25"/><text x="312" y="81" text-anchor="middle" font-size="17">เพิ่ม / แก้ไข / นำสินค้าออก</text><path class="line" d="M95 195L158 139"/><ellipse class="uc" cx="312" cy="139" rx="154" ry="25"/><text x="312" y="145" text-anchor="middle" font-size="17">กำหนดและปรับส่วนลด</text><path class="line" d="M95 195L158 203"/><ellipse class="uc" cx="312" cy="203" rx="154" ry="25"/><text x="312" y="209" text-anchor="middle" font-size="17">ตรวจข้อมูลสินค้าคงคลัง</text><path class="line" d="M95 195L158 267"/><ellipse class="uc" cx="312" cy="267" rx="154" ry="25"/><text x="312" y="273" text-anchor="middle" font-size="17">ดูรายงานยอดขาย</text><path class="line" d="M95 195L158 331"/><ellipse class="uc" cx="312" cy="331" rx="154" ry="25"/><text x="312" y="337" text-anchor="middle" font-size="17">ดูสินค้าขายดีผ่านรายงาน</text></g></svg>