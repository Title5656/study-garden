<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 330" role="img" aria-labelledby="title desc"><title id="title">แผนที่เชื่อมฮาร์ดแวร์ คำสั่ง และระบบปฏิบัติการ</title><desc id="desc">Original supplementary teaching diagram for CA00. Detailed parts and flow are explained beside this image.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18384b}.label{font-size:18px;font-weight:700}.small{font-size:14px;font-weight:400}.tiny{font-size:12px}.blue{fill:#e1eef7;stroke:#83acc8;stroke-width:1.5}.sand{fill:#fff0cf;stroke:#d6b96f;stroke-width:1.5}.green{fill:#dcf0e4;stroke:#86b89a;stroke-width:1.5}.rose{fill:#f8e4e5;stroke:#cc9caa;stroke-width:1.5}.arrow{fill:none;stroke:#4b718b;stroke-width:2.5}.track{fill:none;stroke:#83acc8;stroke-width:2}.hub{fill:#fff;stroke:#83acc8;stroke-width:2}.arm{fill:none;stroke:#365e7a;stroke-width:9;stroke-linecap:round}</style><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4b718b"/></marker></defs><rect width="828" height="330" rx="18" fill="#f7fafc"/><rect x="38" y="90" width="208" height="90" rx="14" class="blue"/><text x="142.0" y="131.0" class="label" text-anchor="middle">HARDWARE</text><text x="142.0" y="155.0" class="small" text-anchor="middle">CPU · memory · I/O</text><path d="M246,135 L302,135" class="arrow" marker-end="url(#head)"/><rect x="310" y="90" width="208" height="90" rx="14" class="blue"/><text x="414.0" y="131.0" class="label" text-anchor="middle">INSTRUCTIONS</text><text x="414.0" y="155.0" class="small" text-anchor="middle">data · ISA · pipeline</text><path d="M518,135 L574,135" class="arrow" marker-end="url(#head)"/><rect x="582" y="90" width="208" height="90" rx="14" class="blue"/><text x="686.0" y="131.0" class="label" text-anchor="middle">OPERATING SYSTEM</text><text x="686.0" y="155.0" class="small" text-anchor="middle">process · scheduling</text><text x="414" y="236" class="small" text-anchor="middle">Understand each layer, then follow how they work together.</text></svg>
