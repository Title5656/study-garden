<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 330" role="img" aria-labelledby="title desc"><title id="title">ส่วนประกอบคอมพิวเตอร์และการแลกเปลี่ยนข้อมูล</title><desc id="desc">Original supplementary teaching diagram for CA01. Detailed parts and flow are explained beside this image.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18384b}.label{font-size:18px;font-weight:700}.small{font-size:14px;font-weight:400}.tiny{font-size:12px}.blue{fill:#e1eef7;stroke:#83acc8;stroke-width:1.5}.sand{fill:#fff0cf;stroke:#d6b96f;stroke-width:1.5}.green{fill:#dcf0e4;stroke:#86b89a;stroke-width:1.5}.rose{fill:#f8e4e5;stroke:#cc9caa;stroke-width:1.5}.arrow{fill:none;stroke:#4b718b;stroke-width:2.5}.track{fill:none;stroke:#83acc8;stroke-width:2}.hub{fill:#fff;stroke:#83acc8;stroke-width:2}.arm{fill:none;stroke:#365e7a;stroke-width:9;stroke-linecap:round}</style><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4b718b"/></marker></defs><rect width="828" height="330" rx="18" fill="#f7fafc"/><rect x="42" y="100" width="190" height="100" rx="14" class="blue"/><text x="137.0" y="146.0" class="label" text-anchor="middle">INPUT / OUTPUT</text><text x="137.0" y="170.0" class="small" text-anchor="middle">devices exchange data</text><rect x="314" y="100" width="200" height="100" rx="14" class="blue"/><text x="414.0" y="146.0" class="label" text-anchor="middle">CPU</text><text x="414.0" y="170.0" class="small" text-anchor="middle">control unit + ALU</text><rect x="596" y="100" width="190" height="100" rx="14" class="blue"/><text x="691.0" y="146.0" class="label" text-anchor="middle">MEMORY</text><text x="691.0" y="170.0" class="small" text-anchor="middle">instructions + data</text><path d="M232,135 L306,135" class="arrow" marker-end="url(#head)"/><path d="M306,170 L232,170" class="arrow" marker-end="url(#head)"/><path d="M514,135 L588,135" class="arrow" marker-end="url(#head)"/><path d="M588,170 L514,170" class="arrow" marker-end="url(#head)"/><text x="414" y="58" class="label" text-anchor="middle">One computer, different responsibilities</text><text x="414" y="249" class="small" text-anchor="middle">Addresses identify a location; data carries its contents.</text></svg>
