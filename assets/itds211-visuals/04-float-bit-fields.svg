<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 330" role="img" aria-labelledby="title desc"><title id="title">บิตเครื่องหมาย เลขชี้กำลัง และเศษส่วนของ binary32</title><desc id="desc">Original supplementary teaching diagram for CA03. Detailed parts and flow are explained beside this image.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18384b}.label{font-size:18px;font-weight:700}.small{font-size:14px;font-weight:400}.tiny{font-size:12px}.blue{fill:#e1eef7;stroke:#83acc8;stroke-width:1.5}.sand{fill:#fff0cf;stroke:#d6b96f;stroke-width:1.5}.green{fill:#dcf0e4;stroke:#86b89a;stroke-width:1.5}.rose{fill:#f8e4e5;stroke:#cc9caa;stroke-width:1.5}.arrow{fill:none;stroke:#4b718b;stroke-width:2.5}.track{fill:none;stroke:#83acc8;stroke-width:2}.hub{fill:#fff;stroke:#83acc8;stroke-width:2}.arm{fill:none;stroke:#365e7a;stroke-width:9;stroke-linecap:round}</style><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4b718b"/></marker></defs><rect width="828" height="330" rx="18" fill="#f7fafc"/><text x="414" y="64" class="label" text-anchor="middle">IEEE 754 binary32: 32 bits with three jobs</text><rect x="45" y="102" width="85" height="84" rx="14" class="rose"/><text x="87.5" y="140.0" class="label" text-anchor="middle">S</text><text x="87.5" y="164.0" class="small" text-anchor="middle">1 bit</text><rect x="138" y="102" width="220" height="84" rx="14" class="sand"/><text x="248.0" y="140.0" class="label" text-anchor="middle">EXPONENT</text><text x="248.0" y="164.0" class="small" text-anchor="middle">8 bits · bias 127</text><rect x="366" y="102" width="415" height="84" rx="14" class="blue"/><text x="573.5" y="140.0" class="label" text-anchor="middle">FRACTION</text><text x="573.5" y="164.0" class="small" text-anchor="middle">23 bits</text><text x="414" y="239" class="small" text-anchor="middle">Normal value = (−1)^S × (1 + fraction) × 2^(exponent − 127)</text><text x="414" y="273" class="small" text-anchor="middle">Exponent 0 and 255 need the special-case rules explained in the lesson.</text></svg>
