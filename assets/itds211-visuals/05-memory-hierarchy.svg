<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 330" role="img" aria-labelledby="title desc"><title id="title">ลำดับชั้นหน่วยความจำจากรีจิสเตอร์ถึงที่เก็บข้อมูล</title><desc id="desc">Original supplementary teaching diagram for CA04. Detailed parts and flow are explained beside this image.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18384b}.label{font-size:18px;font-weight:700}.small{font-size:14px;font-weight:400}.tiny{font-size:12px}.blue{fill:#e1eef7;stroke:#83acc8;stroke-width:1.5}.sand{fill:#fff0cf;stroke:#d6b96f;stroke-width:1.5}.green{fill:#dcf0e4;stroke:#86b89a;stroke-width:1.5}.rose{fill:#f8e4e5;stroke:#cc9caa;stroke-width:1.5}.arrow{fill:none;stroke:#4b718b;stroke-width:2.5}.track{fill:none;stroke:#83acc8;stroke-width:2}.hub{fill:#fff;stroke:#83acc8;stroke-width:2}.arm{fill:none;stroke:#365e7a;stroke-width:9;stroke-linecap:round}</style><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4b718b"/></marker></defs><rect width="828" height="330" rx="18" fill="#f7fafc"/><rect x="309.0" y="45" width="210" height="53" rx="14" class="rose"/><text x="414.0" y="67.5" class="label" text-anchor="middle">REGISTERS</text><text x="414.0" y="91.5" class="small" text-anchor="middle">closest to the CPU</text><rect x="246.5" y="105" width="335" height="53" rx="14" class="sand"/><text x="414.0" y="127.5" class="label" text-anchor="middle">CACHE</text><text x="414.0" y="151.5" class="small" text-anchor="middle">recently used blocks</text><rect x="179.0" y="165" width="470" height="53" rx="14" class="blue"/><text x="414.0" y="187.5" class="label" text-anchor="middle">MAIN MEMORY</text><text x="414.0" y="211.5" class="small" text-anchor="middle">working programs and data</text><rect x="104.0" y="225" width="620" height="53" rx="14" class="green"/><text x="414.0" y="247.5" class="label" text-anchor="middle">SECONDARY STORAGE</text><text x="414.0" y="271.5" class="small" text-anchor="middle">persistent files</text><path d="M65,220 L65,90" class="arrow" marker-end="url(#head)"/><text x="65" y="253" class="small" text-anchor="middle">FASTER</text><path d="M757,90 L757,220" class="arrow" marker-end="url(#head)"/><text x="757" y="253" class="small" text-anchor="middle">LARGER</text></svg>
