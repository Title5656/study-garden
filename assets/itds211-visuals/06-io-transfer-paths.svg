<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 330" role="img" aria-labelledby="title desc"><title id="title">เปรียบเทียบผู้รอและผู้ย้ายข้อมูลใน I/O สามแบบ</title><desc id="desc">Original supplementary teaching diagram for CA05. Detailed parts and flow are explained beside this image.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18384b}.label{font-size:18px;font-weight:700}.small{font-size:14px;font-weight:400}.tiny{font-size:12px}.blue{fill:#e1eef7;stroke:#83acc8;stroke-width:1.5}.sand{fill:#fff0cf;stroke:#d6b96f;stroke-width:1.5}.green{fill:#dcf0e4;stroke:#86b89a;stroke-width:1.5}.rose{fill:#f8e4e5;stroke:#cc9caa;stroke-width:1.5}.arrow{fill:none;stroke:#4b718b;stroke-width:2.5}.track{fill:none;stroke:#83acc8;stroke-width:2}.hub{fill:#fff;stroke:#83acc8;stroke-width:2}.arm{fill:none;stroke:#365e7a;stroke-width:9;stroke-linecap:round}</style><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4b718b"/></marker></defs><rect width="828" height="330" rx="18" fill="#f7fafc"/><text x="414" y="34" class="label" text-anchor="middle">Who waits, and who moves the data?</text><rect x="35" y="65" width="205" height="60" rx="14" class="rose"/><text x="137.5" y="100.0" class="label" text-anchor="middle">PROGRAMMED I/O</text><path d="M240,95 L292,95" class="arrow" marker-end="url(#head)"/><rect x="300" y="65" width="225" height="60" rx="14" class="blue"/><text x="412.5" y="100.0" class="label" text-anchor="middle">CPU checks device</text><path d="M525,95 L577,95" class="arrow" marker-end="url(#head)"/><rect x="585" y="65" width="205" height="60" rx="14" class="blue"/><text x="687.5" y="100.0" class="label" text-anchor="middle">CPU moves data</text><rect x="35" y="145" width="205" height="60" rx="14" class="sand"/><text x="137.5" y="180.0" class="label" text-anchor="middle">INTERRUPT I/O</text><path d="M240,175 L292,175" class="arrow" marker-end="url(#head)"/><rect x="300" y="145" width="225" height="60" rx="14" class="blue"/><text x="412.5" y="180.0" class="label" text-anchor="middle">device signals ready</text><path d="M525,175 L577,175" class="arrow" marker-end="url(#head)"/><rect x="585" y="145" width="205" height="60" rx="14" class="blue"/><text x="687.5" y="180.0" class="label" text-anchor="middle">CPU moves data</text><rect x="35" y="225" width="205" height="60" rx="14" class="green"/><text x="137.5" y="260.0" class="label" text-anchor="middle">DMA</text><path d="M240,255 L292,255" class="arrow" marker-end="url(#head)"/><rect x="300" y="225" width="225" height="60" rx="14" class="blue"/><text x="412.5" y="260.0" class="label" text-anchor="middle">CPU sets up transfer</text><path d="M525,255 L577,255" class="arrow" marker-end="url(#head)"/><rect x="585" y="225" width="205" height="60" rx="14" class="blue"/><text x="687.5" y="260.0" class="label" text-anchor="middle">DMA moves a block</text></svg>
