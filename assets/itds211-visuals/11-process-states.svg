<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 330" role="img" aria-labelledby="title desc"><title id="title">เหตุการณ์ที่ทำให้ process เปลี่ยนสถานะ</title><desc id="desc">Original supplementary teaching diagram for OS02. Detailed parts and flow are explained beside this image.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18384b}.label{font-size:18px;font-weight:700}.small{font-size:14px;font-weight:400}.tiny{font-size:12px}.blue{fill:#e1eef7;stroke:#83acc8;stroke-width:1.5}.sand{fill:#fff0cf;stroke:#d6b96f;stroke-width:1.5}.green{fill:#dcf0e4;stroke:#86b89a;stroke-width:1.5}.rose{fill:#f8e4e5;stroke:#cc9caa;stroke-width:1.5}.arrow{fill:none;stroke:#4b718b;stroke-width:2.5}.track{fill:none;stroke:#83acc8;stroke-width:2}.hub{fill:#fff;stroke:#83acc8;stroke-width:2}.arm{fill:none;stroke:#365e7a;stroke-width:9;stroke-linecap:round}</style><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4b718b"/></marker></defs><rect width="828" height="330" rx="18" fill="#f7fafc"/><rect x="40" y="65" width="184" height="75" rx="14" class="blue"/><text x="132.0" y="98.5" class="label" text-anchor="middle">READY</text><text x="132.0" y="122.5" class="small" text-anchor="middle">waiting for CPU</text><rect x="319" y="65" width="190" height="75" rx="14" class="green"/><text x="414.0" y="98.5" class="label" text-anchor="middle">RUNNING</text><text x="414.0" y="122.5" class="small" text-anchor="middle">using the CPU</text><rect x="604" y="65" width="184" height="75" rx="14" class="rose"/><text x="696.0" y="98.5" class="label" text-anchor="middle">TERMINATED</text><text x="696.0" y="122.5" class="small" text-anchor="middle">finished</text><rect x="319" y="230" width="190" height="75" rx="14" class="sand"/><text x="414.0" y="263.5" class="label" text-anchor="middle">BLOCKED</text><text x="414.0" y="287.5" class="small" text-anchor="middle">waiting for an event</text><path d="M224,90 L311,90" class="arrow" marker-end="url(#head)"/><text x="267.5" y="80.0" class="small" text-anchor="middle">dispatch</text><path d="M319,129 L232,129" class="arrow" marker-end="url(#head)"/><text x="275.5" y="119.0" class="small" text-anchor="middle">timeout</text><path d="M509,102 L596,102" class="arrow" marker-end="url(#head)"/><text x="552.5" y="92.0" class="small" text-anchor="middle">exit</text><path d="M414,140 L414,222" class="arrow" marker-end="url(#head)"/><text x="414.0" y="171.0" class="small" text-anchor="middle">I/O request</text><path d="M319,268 L132,268 L132,148" class="arrow" marker-end="url(#head)"/><text x="191" y="256" class="small" text-anchor="middle">I/O complete</text></svg>
