<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 330" role="img" aria-labelledby="title desc"><title id="title">คำสั่งสามคำสั่งซ้อนงานใน pipeline ห้าขั้น</title><desc id="desc">Original supplementary teaching diagram for CA07. Detailed parts and flow are explained beside this image.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18384b}.label{font-size:18px;font-weight:700}.small{font-size:14px;font-weight:400}.tiny{font-size:12px}.blue{fill:#e1eef7;stroke:#83acc8;stroke-width:1.5}.sand{fill:#fff0cf;stroke:#d6b96f;stroke-width:1.5}.green{fill:#dcf0e4;stroke:#86b89a;stroke-width:1.5}.rose{fill:#f8e4e5;stroke:#cc9caa;stroke-width:1.5}.arrow{fill:none;stroke:#4b718b;stroke-width:2.5}.track{fill:none;stroke:#83acc8;stroke-width:2}.hub{fill:#fff;stroke:#83acc8;stroke-width:2}.arm{fill:none;stroke:#365e7a;stroke-width:9;stroke-linecap:round}</style><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4b718b"/></marker></defs><rect width="828" height="330" rx="18" fill="#f7fafc"/><text x="414" y="35" class="label" text-anchor="middle">Different instructions overlap; each keeps its own order.</text><text x="218" y="73" class="small" text-anchor="middle">1</text><text x="298" y="73" class="small" text-anchor="middle">2</text><text x="378" y="73" class="small" text-anchor="middle">3</text><text x="458" y="73" class="small" text-anchor="middle">4</text><text x="538" y="73" class="small" text-anchor="middle">5</text><text x="618" y="73" class="small" text-anchor="middle">6</text><text x="698" y="73" class="small" text-anchor="middle">7</text><text x="100" y="124" class="small" text-anchor="middle">Instruction 1</text><rect x="184" y="94" width="69" height="44" rx="14" class="blue"/><text x="218.5" y="121.0" class="label" text-anchor="middle">IF</text><rect x="264" y="94" width="69" height="44" rx="14" class="blue"/><text x="298.5" y="121.0" class="label" text-