<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 330" role="img" aria-labelledby="title desc"><title id="title">ตัวอย่างเสริม FCFS พร้อมเวลารอและเวลาตั้งแต่มาถึงจนเสร็จ</title><desc id="desc">Original supplementary teaching diagram for OS03. Detailed parts and flow are explained beside this image.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18384b}.label{font-size:18px;font-weight:700}.small{font-size:14px;font-weight:400}.tiny{font-size:12px}.blue{fill:#e1eef7;stroke:#83acc8;stroke-width:1.5}.sand{fill:#fff0cf;stroke:#d6b96f;stroke-width:1.5}.green{fill:#dcf0e4;stroke:#86b89a;stroke-width:1.5}.rose{fill:#f8e4e5;stroke:#cc9caa;stroke-width:1.5}.arrow{fill:none;stroke:#4b718b;stroke-width:2.5}.track{fill:none;stroke:#83acc8;stroke-width:2}.hub{fill:#fff;stroke:#83acc8;stroke-width:2}.arm{fill:none;stroke:#365e7a;stroke-width:9;stroke-linecap:round}</style><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4b718b"/></marker></defs><rect width="828" height="330" rx="18" fill="#f7fafc"/><text x="414" y="40" class="label" text-anchor="middle">FCFS example · all three jobs arrive at time 0</text><rect x="66" y="83" width="278" height="64" rx="14" class="blue"/><text x="205.0" y="120.0" class="label" text-anchor="middle">A · burst 5</text><rect x="344" y="83" width="167" height="64" rx="14" class="sand"/><text x="427.5" y="120.0" class="label" text-anchor="middle">B · burst 3</text><rect x="511" y="83" width="223" height="64" rx="14" class="green"/><text x="622.5" y="120.0" class="label" text-anchor="middle">C · burst 4</text><text x="66" y="173" class="small" text-anchor="middle">0</text><text x="344" y="173" class="small" text-anchor="middle">5</text><text x="511" y="173" class="small" text-anchor="middle">8</text><text x="734" y="173" class="small" text-anchor="middle">12</text><rect x="66" y="216" width="310" height="70" rx="14" class="sand"/><text x="221.0" y="247.0" class="label" text-anchor="middle">WAITING</text><text x="221.0" y="271.0" class="small" text-anchor="middle">A = 0 · B = 5 · C = 8</text><rect x="424" y="216" width="310" height="70" rx="14" class="green"/><text x="579.0" y="247.0" class="label" text-anchor="middle">TURNAROUND</text><text x="579.0" y="271.0" class="small" text-anchor="middle">A = 5 · B = 8 · C = 12</text></svg>
