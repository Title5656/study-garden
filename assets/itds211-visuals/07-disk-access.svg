<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 330" role="img" aria-labelledby="title desc"><title id="title">สามช่วงเวลาที่ต้องใช้ก่อนดิสก์ส่งข้อมูลครบ</title><desc id="desc">Original supplementary teaching diagram for CA06. Detailed parts and flow are explained beside this image.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#18384b}.label{font-size:18px;font-weight:700}.small{font-size:14px;font-weight:400}.tiny{font-size:12px}.blue{fill:#e1eef7;stroke:#83acc8;stroke-width:1.5}.sand{fill:#fff0cf;stroke:#d6b96f;stroke-width:1.5}.green{fill:#dcf0e4;stroke:#86b89a;stroke-width:1.5}.rose{fill:#f8e4e5;stroke:#cc9caa;stroke-width:1.5}.arrow{fill:none;stroke:#4b718b;stroke-width:2.5}.track{fill:none;stroke:#83acc8;stroke-width:2}.hub{fill:#fff;stroke:#83acc8;stroke-width:2}.arm{fill:none;stroke:#365e7a;stroke-width:9;stroke-linecap:round}</style><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#4b718b"/></marker></defs><rect width="828" height="330" rx="18" fill="#f7fafc"/><text x="414" y="34" class="label" text-anchor="middle">Disk access: position first, then transfer</text><circle cx="180" cy="160" r="107" class="blue"/><circle cx="180" cy="160" r="74" class="track"/><circle cx="180" cy="160" r="42" class="track"/><circle cx="180" cy="160" r="13" class="hub"/><path d="M40,105 L153,138 L170,151" class="arm"/><text x="180" y="298" class="small" text-anchor="middle">track + sector + read/write head</text><rect x="355" y="60" width="400" height="55" rx="14" class="rose"/><text x="555.0" y="92.5" class="label" text-anchor="middle">1 · SEEK</text><rect x="355" y="133" width="400" height="55" rx="14" class="sand"/><text x="555.0" y="165.5" class="label" text-anchor="middle">2 · ROTATIONAL LATENCY</text><rect x="355" y="206" width="400" height="55" rx="14" class="green"/><text x="555.0" y="238.5" class="label" text-anchor="middle">3 · TRANSFER</text><path d="M555,115 L555,125" class="arrow" marker-end="url(#head)"/><path d="M555,188 L555,198" class="arrow" marker-end="url(#head)"/></svg>
